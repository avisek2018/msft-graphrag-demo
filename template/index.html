<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG Medical Query Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .query-section {
            margin-bottom: 30px;
        }

        .query-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .method-select {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .method-select label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin: 0;
        }

        select {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 30px;
            display: none;
        }

        .results-header {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .results-header h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }

        .query-meta {
            font-size: 12px;
            color: #666;
        }

        .result-content {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            max-height: 600px;
            overflow-y: auto;
        }

        .result-content h2 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #667eea;
        }

        .result-content h3 {
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #555;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            display: none;
        }

        .success-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }

        .example-queries {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .example-queries h3 {
            font-size: 13px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-btn {
            padding: 8px 12px;
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 GraphRAG Medical Query</h1>
            <p>Ask questions about patient medical records using AI-powered knowledge graph search</p>
        </div>

        <div class="content">
            <div class="example-queries">
                <h3>📋 Example Queries</h3>
                <div class="example-buttons">
                    <button class="example-btn" onclick="setQuery('What conditions does this patient have?')">Patient Conditions</button>
                    <button class="example-btn" onclick="setQuery('What medications is the patient taking?')">Medications</button>
                    <button class="example-btn" onclick="setQuery('What procedures has the patient undergone?')">Procedures</button>
                    <button class="example-btn" onclick="setQuery('What are the patient\'s lab values and observations?')">Lab Results</button>
                </div>
            </div>

            <div class="query-section">
                <label>Enter Your Question</label>
                <div class="input-group">
                    <textarea id="queryInput" placeholder="e.g., What conditions does this patient have? What medications are they taking? etc."></textarea>
                </div>

                <div class="controls">
                    <div class="method-select">
                        <label>Search Method</label>
                        <select id="methodSelect">
                            <option value="local">Local (Detailed)</option>
                            <option value="global">Global (Comprehensive)</option>
                            <option value="drift">Drift (Advanced)</option>
                            <option value="basic">Basic (Fast)</option>
                        </select>
                    </div>
                    <button id="submitBtn" onclick="submitQuery()">Send Query</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your query... This may take a moment.</p>
            </div>

            <div class="error" id="error"></div>

            <div class="results-section" id="resultsSection">
                <div class="results-header">
                    <h3>Query Results <span class="success-badge" id="successBadge"></span></h3>
                    <div class="query-meta">
                        <strong>Method:</strong> <span id="resultMethod"></span> | 
                        <strong>Query:</strong> <span id="resultQuery"></span>
                    </div>
                </div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        function setQuery(example) {
            document.getElementById('queryInput').value = example;
            document.getElementById('queryInput').focus();
        }

        async function submitQuery() {
            const query = document.getElementById('queryInput').value.trim();
            const method = document.getElementById('methodSelect').value;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const resultsSection = document.getElementById('resultsSection');

            // Validation
            if (!query) {
                error.textContent = 'Please enter a query';
                error.style.display = 'block';
                return;
            }

            // Reset UI
            error.style.display = 'none';
            resultsSection.style.display = 'none';
            loading.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        method: method,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Query failed');
                }

                // Display results
                document.getElementById('resultMethod').textContent = method;
                document.getElementById('resultQuery').textContent = query;
                document.getElementById('resultContent').textContent = data.response;
                document.getElementById('successBadge').textContent = '✓ Success';
                resultsSection.style.display = 'block';

            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        // Submit on Enter key
        document.getElementById('queryInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                submitQuery();
            }
        });
    </script>
</body>
</html>
